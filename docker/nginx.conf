events {
  worker_connections 2048;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # Performance Optimizations
  sendfile        on;
  tcp_nopush      on;
  tcp_nodelay     on;
  keepalive_timeout 65;
  client_max_body_size 25M;
  client_body_buffer_size 128k;

  # Security: Hide Nginx Version Information
  server_tokens off;

  # Gzip Compression
  gzip on;
  gzip_disable "msie6";
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_buffers 16 8k;
  gzip_http_version 1.1;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

  # Rate Limiting Zones (DDoS and Brute-force Mitigation)
  limit_req_zone $binary_remote_addr zone=general_api:10m rate=30r/s;
  limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

  upstream frontend_upstream {
    server frontend:3000;
    keepalive 32;
  }

  upstream backend_upstream {
    server backend:3001;
    keepalive 32;
  }

  server {
    listen 80;
    server_name _;

    # Core Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Deny access to hidden dotfiles (e.g. .env, .git)
    location ~ /\. {
      deny all;
      access_log off;
      log_not_found off;
    }

    # Strict Rate-Limited Authentication Endpoints
    location /api/v1/auth/ {
      limit_req zone=auth_limit burst=10 nodelay;
      proxy_pass http://backend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
    }

    # General API Endpoints
    location /api/ {
      limit_req zone=general_api burst=50 nodelay;
      proxy_pass http://backend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_cache_bypass $http_upgrade;
      proxy_read_timeout 90s;
      proxy_connect_timeout 60s;
    }

    # Next.js Static Chunks Cache Optimization (1 Year Immutable)
    location /_next/static/ {
      proxy_pass http://frontend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      expires 365d;
      access_log off;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # PWA Service Worker & Manifest (Never Cache Aggressively)
    location = /sw.js {
      proxy_pass http://frontend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /manifest.json {
      proxy_pass http://frontend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      add_header Cache-Control "public, max-age=3600";
    }

    # Frontend Next.js Application Proxy
    location / {
      proxy_pass http://frontend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_cache_bypass $http_upgrade;
      proxy_read_timeout 60s;
    }
  }
}
