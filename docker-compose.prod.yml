version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: myfair_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_myfair_2026}
      POSTGRES_DB: ${POSTGRES_DB:-myfair_inventory}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:${DB_PORT:-5445}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-myfair_inventory}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - myfair-network

  redis:
    image: redis:7-alpine
    container_name: myfair_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6385}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - myfair-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: myfair_backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_secure_myfair_2026}@postgres:5432/${POSTGRES_DB:-myfair_inventory}?schema=public
      - DIRECT_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_secure_myfair_2026}@postgres:5432/${POSTGRES_DB:-myfair_inventory}?schema=public
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-myfair-super-secret-jwt-key-for-inventory-saas-2026}
      - JWT_EXPIRY=7d
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-myfair-refresh-secret-key-for-inventory-saas-2026}
      - JWT_REFRESH_EXPIRY=30d
      - FRONTEND_URL=https://myfair.webbea.qa
      - THROTTLE_TTL=60
      - THROTTLE_LIMIT=200
      - SUPER_ADMIN_EMAIL=${SUPER_ADMIN_EMAIL:-admin@inventorysaas.com}
      - SUPER_ADMIN_PASSWORD=${SUPER_ADMIN_PASSWORD:-Admin@123456}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-3061}:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - myfair-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=/api/v1
    container_name: myfair_frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_PUBLIC_API_URL=/api/v1
      - NEXT_PUBLIC_APP_URL=https://myfair.webbea.qa
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3060}:3000"
    depends_on:
      - backend
    networks:
      - myfair-network

volumes:
  postgres_data:
  redis_data:

networks:
  myfair-network:
    driver: bridge
